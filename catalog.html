<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Каталог товаров</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <a class="skip-link" href="#main">Перейти к основному содержимому</a>

  <header class="site-header">
    <div class="container">
      <a class="site-logo" href="index.html">ShopProject</a>
      <nav class="site-nav" aria-label="Основная навигация">
        <ul class="site-nav__list">
          <li><a href="index.html">Главная</a></li>
          <li><a href="catalog.html">Каталог</a></li>
          <li><a href="order.html">Заявка</a></li>
          <li><a href="contacts.html">Контакты</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main id="main" class="main section">
    <h1>Каталог товаров</h1>
    <div class="catalog-layout">
      <aside class="catalog-filters">
        <h2>Фильтры</h2>
        <form>
          <label><input type="checkbox"> Категория 1</label><br>
          <label><input type="checkbox"> Категория 2</label>
        </form>
      </aside>
      
      <section class="catalog-products">
        <div class="products-grid">
          <!-- Карточки товаров (скопируй из index.html) -->
          <article class="product-card">
            <img src="images/product-1.jpg" alt="Товар 1" class="product-card__image">
            <div class="product-card__content">
              <h3 class="product-card__title">Товар 1</h3>
              <p class="product-card__description">Описание.</p>
              <p class="product-card__price">1000 руб.</p>
              <a href="product.html" class="button product-card__button">Подробнее</a>
            </div>
          </article>
          <article class="product-card">
            <img src="images/product-2.jpg" alt="Товар 2" class="product-card__image">
            <div class="product-card__content">
              <h3 class="product-card__title">Товар 2</h3>
              <p class="product-card__description">Описание.</p>
              <p class="product-card__price">1500 руб.</p>
              <a href="product.html" class="button product-card__button">Подробнее</a>
            </div>
          </article>
        </div>
      </section>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <p>&copy; 2026 Учебный проект. Все права защищены.</p>
    </div>
  </footer>
</body>
</html>
